name: CMake Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:berndporr/dsp
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev qt6-base-dev qt6-multimedia-dev iir1 iir1-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --parallel