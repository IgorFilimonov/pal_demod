name: CMake Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:berndporr/dsp
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev qt6-base-dev qt6-multimedia-dev iir1 iir1-dev

      - name: Install Qt 6.8.0 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtmultimedia'
          cache: true

      - name: Install OpenCV 4.10.0 (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Downloading OpenCV 4.10.0..."
          curl -L -o opencv-setup.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          
          Write-Host "Extracting OpenCV..."
          7z x opencv-setup.exe -o"C:\opencv" -y
          
          Write-Host "Searching for OpenCVConfig.cmake..."
          $configFile = Get-ChildItem -Path "C:\opencv" -Recurse -Filter "OpenCVConfig.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $configFile) {
            Write-Host "Available files in C:\opencv:"
            Get-ChildItem -Path "C:\opencv" -Recurse | Select-Object -First 20
            throw "OpenCVConfig.cmake not found!"
          }
          
          $opencvBuildDir = $configFile.DirectoryName
          Write-Host "Found OpenCVConfig.cmake at: $opencvBuildDir"
          
          echo "OpenCV_DIR=$opencvBuildDir" >> $env:GITHUB_ENV
          
          foreach ($vc in @("vc16", "vc17")) {
            $binPath = "C:\opencv\build\x64\$vc\bin"
            if (Test-Path $binPath) {
              echo $binPath >> $env:GITHUB_PATH
              Write-Host "Added to PATH: $binPath"
            }
          }
        shell: pwsh
        timeout-minutes: 5

      - name: Install iir1 (Windows)
        if: runner.os == 'Windows'
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: iir1
          triplet: x64-windows

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "OpenCV_DIR: $env:OpenCV_DIR"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="${env:OpenCV_DIR}" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        shell: pwsh

      - name: Build Project
        run: cmake --build build --parallel