name: CMake Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev qt6-base-dev qt6-multimedia-dev

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtmultimedia'
          cache: true

      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -L -o opencv-setup.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          Start-Process -FilePath .\opencv-setup.exe -ArgumentList "/S", "/D=C:\opencv" -Wait
          
          if (-not (Test-Path "C:\opencv\build\OpenCVConfig.cmake")) {
            throw "OpenCVConfig.cmake not found! Installation may have failed."
          }
          
          echo "OpenCV_DIR=C:\opencv\build" >> $env:GITHUB_ENV
          echo "C:\opencv\build\x64\vc16\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR=$env:OpenCV_DIR -DCMAKE_PREFIX_PATH=$env:OpenCV_DIR
        shell: pwsh

      - name: Build Project
        run: cmake --build build --parallel